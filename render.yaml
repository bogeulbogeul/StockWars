services:
  - type: web
    name: stockwars-demo-presence
    runtime: node
    plan: free
    rootDir: Server/presence
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
