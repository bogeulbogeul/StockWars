<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>롭이어 토끼 · 모션 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#293b32;font:15px system-ui,sans-serif}header{max-width:1200px;margin:auto;padding:28px 24px 12px}h1{font-size:28px;margin:5px 0 8px}p{color:#647065;line-height:1.6}.controls{position:sticky;top:0;background:#f3f0e8f5;z-index:2;border-block:1px solid #d7ddcf;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #bbc7b6;background:white;border-radius:9px;padding:9px 14px;color:inherit;cursor:pointer}button.active{background:#395f4b;color:white}label{display:flex;align-items:center;gap:8px}main{max-width:1200px;margin:24px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:0 24px}article{background:white;border:1px solid #dce0d6;border-radius:16px;overflow:hidden}article h2{font-size:16px;margin:18px 20px 6px}canvas{display:block;width:100%;height:auto;background-color:#e8eee3;background-image:linear-gradient(45deg,#ffffff40 25%,transparent 25%),linear-gradient(-45deg,#ffffff40 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff40 75%),linear-gradient(-45deg,transparent 75%,#ffffff40 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}article p{font-size:12px;margin:10px 20px}footer{padding:20px 24px 40px;max-width:1200px;margin:auto}a{color:#355f47}.error{color:#a33}
</style><header><small>STOCKWARS / 숲속 친구들</small><h1>롭이어 영애 · 모션 미리보기</h1><p>보넷과 로코코 드레스 · 좌우 앉기 포함 19자세</p><p id="status">이미지 불러오는 중…</p></header>
<section class="controls"><button id="pause">일시정지</button><button id="step">한 프레임씩</button><button id="reset">처음부터</button><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option><option value="2">2배</option></select></label><label>크기 <input id="zoom" type="range" min="0.4" max="1.25" step="0.05" value="1"></label><label>배경 <select id="bg"><option value="#e8eee3">연두</option><option value="#ffffff">흰색</option><option value="#28312f">어두움</option></select></label></section>
<main></main><footer><a href="sprite-sheet.png" target="_blank">기본 시트</a> · <a href="rear-walk-clean.png" target="_blank">발바닥 무늬 제거 · 뒤 걷기 교정본</a> · <a href="prompts.txt">제작 프롬프트</a><p>걷기 A → 중립 → B → 중립, 운반 4자세. 좌측 걷기·운반은 우측의 반전이며 좌우 앉기는 각각 그린 이미지입니다.</p><p>뒤 걷기는 발바닥 무늬를 제거한 별도 교정본으로 재생합니다. 기본 시트의 뒤 걷기 행 대신 교정본을 사용하세요.</p></footer>
<script>
const configs=[['정면 걷기',1,false],['오른쪽 걷기',3,false],['왼쪽 걷기',3,true],['뒤 걷기',5,false],['오른쪽 운반',6,false],['왼쪽 운반',6,true],['정면 앉기',7,false],['화면 오른쪽으로 앉기',8,false,0],['화면 왼쪽으로 앉기',8,false,1],['정면 정지',0,false],['오른쪽 정지',2,false],['뒤 정지',4,false]];
let phase=0,paused=false,last=0,cards=[];const img=new Image();const $=id=>document.getElementById(id);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'재생':'일시정지'};$('step').onclick=()=>{paused=true;phase=Math.floor(phase)+1;$('pause').textContent='재생'};$('reset').onclick=()=>phase=0;$('bg').onchange=()=>document.querySelectorAll('canvas').forEach(c=>c.style.backgroundColor=$('bg').value);
async function init(){const response=await fetch('frames.json');if(!response.ok)throw Error('프레임 정보를 불러올 수 없습니다.');const data=await response.json();img.src=data.image;await img.decode();for(const row of data.rows){if(row.image){row.asset=new Image();row.asset.src=row.image;await row.asset.decode();}}for(const [label,row,flip,only] of configs){const a=document.createElement('article');a.innerHTML='<h2>'+label+'</h2><canvas width="320" height="320"></canvas><p></p>';document.querySelector('main').append(a);const frames=only===undefined?data.rows[row].frames:[data.rows[row].frames[only]];cards.push({ctx:a.querySelector('canvas').getContext('2d'),frames,baseline:data.rows[row].baseline,image:data.rows[row].asset||img,scale:data.rows[row].scale||1,flip,caption:a.querySelector('p')});}$('status').textContent='모션 재생 중 · 일시정지하거나 한 프레임씩 넘겨볼 수 있어요.';requestAnimationFrame(draw);}
function draw(t){if(last&&!paused)phase+=(t-last)/160*Number($('speed').value);last=t;for(const card of cards){const {ctx:c,frames,baseline,flip}=card;const order=frames.length===3?[0,1,2,1]:frames.map((_,i)=>i);const index=order[Math.floor(phase)%order.length],f=frames[index];c.clearRect(0,0,320,320);c.strokeStyle='#7e927777';c.beginPath();c.moveTo(15,285);c.lineTo(305,285);c.stroke();c.save();c.translate(160,285);const z=Number($('zoom').value)*1.08*card.scale;c.scale(flip?-z:z,z);c.drawImage(card.image,f.x,f.y,f.w,f.h,f.x-f.centerX,f.y-baseline,f.w,f.h);c.restore();card.caption.textContent='자세 '+(index+1)+' / '+frames.length;}requestAnimationFrame(draw);}
init().catch(e=>{$('status').textContent=e.message;$('status').className='error'});
</script></html>
