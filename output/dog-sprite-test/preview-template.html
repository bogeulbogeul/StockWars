<!doctype html><html lang="ko"><meta charset="utf-8"><title>강아지 주민 모션 시험</title><style>body{background:#eae7df;font:16px system-ui;color:#2c3e32;margin:0}main{max-width:1000px;margin:24px auto;padding:20px}h1{font-size:24px}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px;border-radius:8px;border:1px solid #aab7aa;background:white}canvas{width:100%;background:#faf8f2;border-radius:18px;margin-top:20px}p{line-height:1.6}</style><main><h1>강아지 주민 스프라이트 시험</h1><div class="controls"><select id="state"><option value="walk">걷기</option><option value="carry">택배 운반</option><option value="sit">앉기</option></select><button id="play">일시정지</button><button id="step">다음 프레임</button><button id="restart">처음부터</button><label>속도<input id="speed" type="range" min=".25" max="1.5" step=".25" value="1"></label></div><canvas id="canvas" width="960" height="420"></canvas><p id="status"></p><p>오른쪽은 생성 원방향, 왼쪽은 반전입니다. 앉기는 마지막 자세에서 멈춥니다. 의자 및 별도 화물 연결·게임 이동속도는 미검증입니다.</p><p id="verdict">외형·모션 검토용 시안이며 게임 적용 전입니다.</p></main><script>
const manifest=__MANIFEST__,image=new Image();image.src='__ATLAS__';const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');let index=0,paused=false,acc=0,last=0;function reset(){index=0;acc=0;paused=false;$('play').textContent='일시정지'}$('state').onchange=reset;$('restart').onclick=reset;$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'재생':'일시정지'};$('step').onclick=()=>{paused=true;$('play').textContent='재생';index=(index+1)%manifest.frame_layout.rows[$('state').value].length};
function draw(t){const key=$('state').value,frames=manifest.frame_layout.rows[key],a=manifest.animation.rows[key],dt=Math.min(100,t-last||0);last=t;if(!paused){acc+=dt*+$('speed').value;while(acc>=1000/a.fps){acc-=1000/a.fps;if(index<frames.length-1)index++;else if(a.loop)index=0;else{paused=true;$('play').textContent='재생';break;}}}ctx.clearRect(0,0,960,420);ctx.fillStyle='#425347';ctx.font='16px system-ui';ctx.fillText('← 반전',180,30);ctx.fillText('원방향 →',660,30);if(image.complete&&image.naturalWidth){const f=frames[index];for(const [x,left] of [[240,true],[720,false]]){ctx.save();ctx.translate(x,60);if(left)ctx.scale(-1,1);ctx.drawImage(image,f.x,f.y,f.w,f.h,-128,0,256,320);ctx.restore();}}$('status').textContent=`${index+1} / ${frames.length} 프레임 · ${a.fps} FPS`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
