<!doctype html><html lang="ko"><meta charset="utf-8"><title>출입문 확대 시안 · H90 비교</title><style>body{background:#eee5d5;color:#292b30;font:16px system-ui;padding:24px}main{max-width:1800px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:#faf6ed;padding:20px;border-radius:12px;overflow:auto}.stage{position:relative;margin:20px auto 0}.building{position:absolute;bottom:0;left:0}.player{position:absolute;bottom:0}.ruler{position:absolute;height:90px;border-left:3px solid #257b80;bottom:0;padding-left:6px;font-size:12px}a{color:#247075}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style><main><h1>출입문 확대 · 플레이어 H90 비교</h1><p>게임의 현재 건물 표시 높이를 유지한 비교입니다. 캐릭터와 건물에 같은 배율을 사용합니다. 게임에 적용한 PNG입니다. 물류창고는 오른쪽 상단 창문을 제거한 버전입니다.</p><div class="grid" id="cards"></div></main><script type="module">import {characterSpriteSVG} from '../../web/js/components/CharacterSprite.js';const items=[['office','오피스',1060,1484,230,62,600,1340,630,.34],['store','비비안 잡화점',1774,887,228,65,1360,735,270,.485],['logistics','비트 물류창고',1774,887,78,118,1620,674,324,.91],['securities','사이퍼 증권',1024,1536,32,40,960,1378,720,.5]];document.querySelector('#cards').innerHTML=items.map(([id,name,w,h,x,y,cw,ch,dh,entry])=>{const dw=dh*cw/ch;return '<article><h2>'+name+'</h2><a href="'+(id==='logistics'?'logistics-v2':id)+'.png">PNG 원본</a> · <a href="'+(id==='logistics'?'logistics-v2':id)+'.prompt.txt">프롬프트</a><div class="stage" style="width:'+Math.ceil(dw+115)+'px;height:'+(dh+15)+'px"><svg class="building" width="'+dw+'" height="'+dh+'" viewBox="'+[x,y,cw,ch].join(' ')+'"><image href="'+(id==='logistics'?'logistics-v2':id)+'.png" width="'+w+'" height="'+h+'"/></svg><div class="player" style="left:'+(dw*entry+25)+'px">'+characterSpriteSVG()+'</div><div class="ruler" style="left:'+(dw*entry+115)+'px">H90</div></div></article>';}).join('');</script></html>
