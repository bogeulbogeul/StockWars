<!doctype html><meta charset="utf-8"><title>고양이·강아지 모션 비교</title>
<style>body{background:#242832;color:#eee;font:16px sans-serif;margin:24px}main{display:flex;flex-wrap:wrap;gap:20px}.card{background:#343a46;padding:14px}canvas{background:#c5c9ce;width:256px;height:256px}button{padding:10px}</style>
<h1>강아지 자세 원본 × 고양이 디자인 v20</h1><p>강아지 왼쪽 / 고양이 오른쪽 · 160ms · 걷기 A→중립→B→중립 · 게임 미설치</p>
<button id="pause">일시정지 / 재생</button><button id="step">다음 프레임</button><main></main>
<script>const layout={"down_idle": [{"x": 0, "y": 0, "w": 512, "h": 512}], "down_walk": [{"x": 0, "y": 512, "w": 512, "h": 512}, {"x": 512, "y": 512, "w": 512, "h": 512}, {"x": 1024, "y": 512, "w": 512, "h": 512}, {"x": 512, "y": 512, "w": 512, "h": 512}], "right_idle": [{"x": 0, "y": 1024, "w": 512, "h": 512}], "right_walk": [{"x": 0, "y": 1536, "w": 512, "h": 512}, {"x": 512, "y": 1536, "w": 512, "h": 512}, {"x": 1024, "y": 1536, "w": 512, "h": 512}, {"x": 512, "y": 1536, "w": 512, "h": 512}], "up_idle": [{"x": 0, "y": 2048, "w": 512, "h": 512}], "up_walk": [{"x": 0, "y": 2560, "w": 512, "h": 512}, {"x": 512, "y": 2560, "w": 512, "h": 512}, {"x": 1024, "y": 2560, "w": 512, "h": 512}, {"x": 512, "y": 2560, "w": 512, "h": 512}], "right_carry": [{"x": 0, "y": 3072, "w": 512, "h": 512}, {"x": 512, "y": 3072, "w": 512, "h": 512}, {"x": 1024, "y": 3072, "w": 512, "h": 512}, {"x": 1536, "y": 3072, "w": 512, "h": 512}], "down_sit": [{"x": 0, "y": 3584, "w": 512, "h": 512}], "right_sit": [{"x": 0, "y": 4096, "w": 512, "h": 512}], "face_portrait": [{"x": 0, "y": 4608, "w": 512, "h": 512}]},states=["down_walk", "right_walk", "up_walk", "right_carry", "down_sit", "right_sit", "face_portrait"];let tick=0,play=true;const dog=new Image(),cat=new Image();dog.src='../dog-rgb-motion-v1/sprite-sheet-alpha.png';cat.src='sprite-sheet-alpha.png?updated='+Date.now();
const cards=states.map(s=>{let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+s+'</h3><canvas width="512" height="512"></canvas><canvas width="512" height="512"></canvas>';document.querySelector('main').append(d);return[s,...d.querySelectorAll('canvas')];});
function draw(){for(const[s,a,b]of cards){const rs=layout[s],r=rs[tick%rs.length];for(const[c,img]of[[a,dog],[b,cat]]){const x=c.getContext('2d');x.clearRect(0,0,512,512);if(img.complete)x.drawImage(img,r.x,r.y,r.w,r.h,0,0,512,512);}}}
document.querySelector('#pause').onclick=()=>play=!play;document.querySelector('#step').onclick=()=>{play=false;tick++;draw()};setInterval(()=>{if(play)tick++;draw()},160);dog.onload=cat.onload=draw;</script>
