<!doctype html><html lang="ko"><meta charset="utf-8"><title>동물 8종 · 색과 그림체 보정</title>
<style>body{margin:24px;background:#eae4d8;color:#332e27;font:16px system-ui}h1{font-size:25px}p{line-height:1.6}header{position:sticky;top:0;background:#eae4d8ed;padding:8px 0;z-index:1}button,select{font:inherit;padding:7px;margin:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px}article{padding:16px;border-radius:12px;background:#fffaf0}h2{margin:0;font-size:20px}.pair{display:flex;gap:10px}.pair>div{width:50%;text-align:center}canvas{display:block;width:100%;background:repeating-conic-gradient(#e6e1d7 0% 25%,#f2eee5 0% 50%) 50%/20px 20px;border-radius:8px}small{color:#70685c}a{color:#52693f}</style>
<h1>강아지·고양이 + 숲속 친구들 6종 · 실제 스프라이트 보정</h1>
<p>캐릭터별 정면 기준 팔레트로 털색·명암·선을 맞췄습니다. 걷기 3그림 · A → 중립 → B → 중립 · 160ms.<br>강아지 꼬리 대기 유지 / 고양이 꼬리 대기 추가 없음 / 발바닥 패드 없음. 가구 접촉·게임 내 동작 검수는 별도입니다.</p>
<header><select id="state"></select><button id="play">멈추기</button><button id="step">한 프레임</button><button id="cycle">모션 자동 전환</button><label><input id="small" type="checkbox">약 90px 크기</label> <label><input id="tail" type="checkbox" checked>강아지 꼬리 대기</label> <label><input id="mirror" type="checkbox">좌우 반전</label> <a href="comparison.png">전체 보정 전후</a></header><main></main>
<script>const items=__ITEMS__,labels=__LABELS__;let playing=true,tick=0,last=0,cycling=false,cycleLast=0;const state=document.querySelector('#state');for(const [s,n]of Object.entries(labels))state.add(new Option(n,s));state.value='down_walk';for(const it of items){const article=document.createElement('article');article.innerHTML=`<h2>${it.label}</h2><div class="pair"><div><small>보정 전</small><canvas width="320" height="400"></canvas></div><div><small>보정 후</small><canvas width="320" height="400"></canvas></div></div><small class="info"></small><p><a href="${it.id}/run/sprite-sheet-alpha.png">투명 시트</a> · <a href="${it.id}/run/manifest.json">manifest</a> · <a href="${it.id}/review-final.png">모든 자세</a></p>`;document.querySelector('main').append(article);it.ctx=[...article.querySelectorAll('canvas')].map(c=>c.getContext('2d'));it.images=[new Image(),new Image()];it.images[0].src=it.before;it.images[1].src=it.after;it.info=article.querySelector('.info')}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'멈추기':'재생'};document.querySelector('#step').onclick=()=>{playing=false;tick++;document.querySelector('#play').textContent='재생'};document.querySelector('#cycle').onclick=()=>{cycling=!cycling;cycleLast=0;document.querySelector('#cycle').textContent=cycling?'자동 전환 중지':'모션 자동 전환'};state.onchange=()=>{tick=0};function draw(t){if(playing&&t-last>=160){tick++;last=t}if(cycling&&t-cycleLast>=2400){const keys=Object.keys(labels);state.value=keys[(keys.indexOf(state.value)+1)%keys.length];tick=0;cycleLast=t}for(const it of items){let s=state.value;if(it.id==='dog'&&document.querySelector('#tail').checked&&it.manifest.frame_layout.rows[s+'_wag'])s+='_wag';const anim=it.manifest.animation.rows[s],order=anim.sequence||anim.playback_order||(s.endsWith('_walk')?[0,1,2,1]:s.endsWith('_wag')?[1,0,1,2]:Array.from({length:anim.frames},(_,i)=>i));const idx=order[tick%order.length],r=it.manifest.frame_layout.rows[s][idx];for(let side=0;side<2;side++){const c=it.ctx[side];c.clearRect(0,0,320,400);const scale=document.querySelector('#small').checked?.28:.88;c.save();c.translate(160,378);c.scale(document.querySelector('#mirror').checked?-scale:scale,scale);if(it.images[side].complete&&it.images[side].naturalWidth)c.drawImage(it.images[side],r.x,r.y,r.w,r.h,-160,-372,320,400);c.restore()}it.info.textContent=`${labels[state.value]} · 프레임 ${idx+1} / ${anim.frames}${s.endsWith('_wag')?' · 꼬리 대기':''}`}requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
