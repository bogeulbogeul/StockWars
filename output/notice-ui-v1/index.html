<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포포리 마을 · 안내문 UI 시안</title>
  <link rel="stylesheet" href="notice.css">
</head>
<body>
  <header class="preview-header"><span>포포리 마을</span><span>안내문 UI · 디자인 시안 01</span></header>
  <main>
    <button class="reopen" id="reopen">안내문 다시 열기</button>
    <dialog aria-labelledby="notice-title" aria-describedby="notice-body">
      <div class="paper">
        <span class="tab">마을 안내</span>
        <button class="close" aria-label="안내문 닫기" title="닫기">×</button>
        <div class="symbol" aria-hidden="true">i</div>
        <p class="eyebrow">포포리 생활 안내</p>
        <h1 id="notice-title">새로운 일상이 시작되는 곳</h1>
        <p class="intro" id="notice-body">포포리 마을에 오신 걸 환영해요.<br>잠깐, 마을을 둘러보기 전에 읽어 주세요.</p>
        <div class="rule" aria-hidden="true"></div>
        <section class="information" aria-label="안내 내용">
          <span class="number" aria-hidden="true">01</span>
          <div><h2>궁금한 일이 있다면 안내소로</h2><p>마을 생활이 낯설 땐 정착 안내소에 들러 보세요.<br class="desktop-break"> 처음 시작하는 하루를 차근차근 안내해 드려요.</p></div>
        </section>
        <aside><span aria-hidden="true">✦</span><p>서두르지 않아도 괜찮아요.<br>나만의 속도로 마을을 알아가 보세요.</p></aside>
        <footer><span class="sender">포포리 마을 정착 안내소</span><button class="confirm">확인했어요 <span aria-hidden="true">✓</span></button></footer>
      </div>
    </dialog>
  </main>
  <div class="preview-footer"><span>NOTICE / 01</span><span>크림 페이퍼 · 세이지 그린 · 코코아 브라운</span><span>본문은 예시 문구입니다</span></div>
  <script src="preview.js"></script>
</body>
</html>
