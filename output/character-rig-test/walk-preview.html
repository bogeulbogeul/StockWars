<main><h1>좌우 걷기 시험</h1><p>오른쪽은 생성 프레임, 왼쪽은 같은 프레임의 좌우 반전입니다. 왼쪽 전용 그림을 생성한 결과는 아닙니다.</p>
<div class="controls"><select id="version"><option value="walk-v2">수정 시안</option><option value="walk-v1">첫 시안</option></select><button id="play">일시정지</button><button id="step">다음 프레임</button><label>재생 속도 <input id="speed" type="range" min="0.25" max="1.5" step="0.25" value="1"><span id="rate">1×</span></label><label><input id="travel" type="checkbox"> 화면 이동</label></div>
<canvas id="stage" width="960" height="390"></canvas><p id="status"></p><p class="note">검수용 실험입니다. 양발 교대·무릎 굽힘·머리 흔들림·루프 연결을 확인하세요. 화면 이동 속도는 시험값이며 게임 이동 속도와의 일치는 미검증입니다.</p></main>
