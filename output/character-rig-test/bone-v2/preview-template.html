<!doctype html><html lang="ko"><meta charset="utf-8"><title>캐릭터 모션 재검증</title><style>body{background:#ebe8df;color:#293d31;font:16px system-ui;margin:0}main{max-width:1100px;margin:24px auto;padding:20px}.controls{display:flex;gap:14px;flex-wrap:wrap}button,select{font:inherit;padding:8px}.views{display:flex;background:#faf9f3;border-radius:18px;margin-top:20px}.views img{width:50%;min-width:0}p{line-height:1.6}</style><main><h2>직립 · 걷기 · 택배 운반 · 앉기</h2><p>얼굴·몸통은 기존 그림, 팔다리와 의자·상자는 형태 검증용 임시 표현입니다. 왼쪽은 반전입니다.</p><div class="controls"><select id="mode"><option value="rest">직립 자세</option><option value="walk">걷기</option><option value="carry">택배 들고 걷기</option><option value="sit">의자 앉기</option></select><button id="play">일시정지</button><button id="stand">일어서기</button><button id="step">다음 자세</button><label><input id="bones" type="checkbox">본 표시</label><label>속도<input id="speed" type="range" min=".25" max="1.5" step=".25" value="1"></label><label>자세<input id="phase" type="range" min="0" max="1" step=".001" value="0"></label></div><div class="views"><img id="left" alt="왼쪽"><img id="right" alt="오른쪽"></div><p id="status"></p><p>상자 집기·내려놓기, 실제 의자 정렬, 게임 이동속도·충돌 연동은 후속 작업입니다.</p></main><script>__RIG__</script><script>
const atlas='__ATLAS__',$=id=>document.getElementById(id);let time=0,last=0,paused=false,urls=[],exiting=false,exitTime=0;
function render(){const mode=exiting?'sit':$('mode').value,p=BoneStudy.pose(time,mode,exiting?Math.max(0,1-exitTime/.45):mode==='sit'?Math.min(1,time/.45):1),opt={mode,debug:$('bones').checked,blend:p.sit};const next=[true,false].map(left=>URL.createObjectURL(new Blob([BoneStudy.svg(time,atlas,{...opt,left})],{type:'image/svg+xml'})));['left','right'].forEach((id,i)=>$(id).src=next[i]);urls.forEach(URL.revokeObjectURL);urls=next;$('status').textContent=mode==='sit'?'의자 앉기: 진입 → 유지':`오른발 ${p.legs.R.contact?'접지':'들기'} / 왼발 ${p.legs.L.contact?'접지':'들기'}`;}
$('stand').onclick=()=>{if($('mode').value==='sit'){exiting=true;exitTime=0;paused=false}};$('mode').onchange=()=>{exiting=false;time=0;render()};$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'재생':'일시정지'};$('step').onclick=()=>{paused=true;time+=BoneStudy.period/16;$('play').textContent='재생';render()};$('phase').oninput=()=>{paused=true;time=+$('phase').value*BoneStudy.period;render()};$('bones').onchange=render;function tick(t){if(!paused){const dt=Math.min(.05,(t-last)/1000||0)*+$('speed').value;time+=dt;if(exiting){exitTime+=dt;if(exitTime>=.45){exiting=false;$('mode').value='rest';time=0;}}$('phase').value=time/BoneStudy.period%1;render()}last=t;requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
