<!doctype html><html lang="ko"><meta charset="utf-8"><title>검은 고양이 방향별 모션 시험</title>
<style>body{background:#eeeae1;color:#30291f;font:16px system-ui;margin:24px}button,input{margin:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(256px,1fr));gap:16px}article{background:#faf9f4;border-radius:16px;text-align:center;padding:12px}canvas{width:256px;height:320px;max-width:100%}h2{font-size:18px}p{max-width:900px}</style>
<h1>검은 고양이 수정본 · 기준 키90</h1><p>좌우 걷기·운반·앉기는 오른쪽 원본을 반전합니다. 앉기는 아이소메트릭 시점입니다. 걷기 연속성과 손·상자 정렬은 시험 중입니다. 정면 중립 기준 키90에 맞춘 공통 배율을 모든 동작에 적용합니다. 확대는 카메라 배율입니다. 상자·의자 정렬은 시험 단계입니다.</p><label>확대 <input id="zoom" type="range" min="1" max="3" step="1" value="1"></label>
<button id="pause">일시정지</button><button id="next">다음 자세</button><label>속도 <input id="speed" type="range" min="0.3" max="2" step="0.1" value="1"></label><label>상자 <input id="stack" type="range" min="0" max="4" value="2"></label><main id="cards"></main>
<script>
const sizing=__SCALE__,manifest=__MANIFEST__,atlas=new Image(),parcel=new Image();atlas.src='__ATLAS__';parcel.src='__PARCEL__';
const entries=[['down_walk','정면 걷기'],['left_walk','왼쪽 걷기'],['right_walk','오른쪽 걷기'],['up_walk','뒤 걷기'],['left_carry','왼쪽 택배 운반'],['right_carry','오른쪽 택배 운반'],['down_sit','정면 의자 앉기'],['left_sit','왼쪽 의자 앉기'],['right_sit','오른쪽 의자 앉기']];
const cards=entries.map(([state,label])=>{const el=document.createElement('article');el.innerHTML='<h2>'+label+'</h2><canvas width="256" height="320"></canvas>';document.querySelector('#cards').append(el);return {state,c:el.querySelector('canvas').getContext('2d')}});
let phase=0,paused=false,last=0;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재생':'일시정지'};document.querySelector('#next').onclick=()=>{paused=true;phase=Math.floor(phase)+1;document.querySelector('#pause').textContent='재생'};
function draw(t){if(last&&!paused)phase+=(t-last)/160*Number(document.querySelector('#speed').value);last=t;for(const {state,c} of cards){c.clearRect(0,0,256,320);const mirrored=state.startsWith("left_");const sourceState=mirrored?state.replace("left_","right_"):state;const frames=manifest.frame_layout.rows[sourceState];if(!frames)continue;const seq=frames.length===4?[0,1,2,3]:frames.length===3?[0,1,2,1]:[0];const i=seq[Math.floor(phase)%seq.length],f=frames[i];const scale=sizing.uniformScale*Number(document.querySelector('#zoom').value);c.save();c.translate(128,296);c.scale(scale,scale);if(mirrored)c.scale(-1,1);c.translate(-128,-sizing.groundY);if(atlas.complete)c.drawImage(atlas,f.x,f.y,f.w,f.h,0,0,256,320);if(state.endsWith('_carry')&&parcel.complete){const x=179;for(let j=0;j<Number(document.querySelector('#stack').value);j++)c.drawImage(parcel,100,130,1055,1010,x,212-35*(j+1),40,35)}c.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
