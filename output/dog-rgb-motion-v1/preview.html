<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>강아지 RGB 모션 시트</title>
<style>
body{margin:0;background:#e9e3da;color:#30261e;font:16px system-ui;padding:28px}
h1{font-size:25px;margin:0 0 8px}p{line-height:1.6}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
article{background:#fffaf2;border:1px solid #d4c6b3;border-radius:12px;padding:16px}h2{font-size:17px;margin:0 0 8px}
canvas{display:block;width:100%;aspect-ratio:1;background:conic-gradient(#eee8df 25%,#faf7f1 0 50%,#eee8df 0 75%,#faf7f1 0) 0 0/24px 24px}
button,input{margin:8px}a{color:#70472a}#sheet{max-width:100%;max-height:1200px;background:#d8cfc1}
</style>
<h1>강아지 · RGB 기준 모션 시트</h1>
<p>기존 채택 동작에 상세 추출 RGB 34색 적용 · 512×512셀 · 프레임당 160ms · 게임 미적용</p>
<button id="toggle">일시정지</button><label><input type="checkbox" id="mirror">좌우 반전</label>
<main id="motions"></main>
<p><a href="sprite-sheet-alpha.png">투명 PNG</a> · <a href="manifest.json">좌표·재생 manifest</a> · <a href="validation.json">검증 기록</a></p>
<details><summary>전체 시트 보기</summary><img id="sheet" src="sprite-sheet-alpha.png" alt="10행 강아지 모션 시트"></details>
<script>
const rows={down_idle:[0,1],down_walk:[1,3],right_idle:[2,1],right_walk:[3,3],up_idle:[4,1],up_walk:[5,3],right_carry:[6,4],down_sit:[7,1],right_sit:[8,1],face_portrait:[9,1]};
const names=['정면 정지','정면 걷기','정측면 정지','정측면 걷기','뒤 정지','뒤 걷기','정측면 운반','정면 앉기','아이소메트릭 앞사선 앉기','얼굴 초상화'];
const atlas=new Image(), displays=[];let elapsed=0,previous=0,paused=false;
Object.entries(rows).forEach(([state,[row,count]],i)=>{const box=document.createElement('article');box.innerHTML=`<h2>${names[i]}</h2><canvas width="512" height="512"></canvas>`;document.querySelector('main').append(box);displays.push({row,count,ctx:box.querySelector('canvas').getContext('2d')})});
document.querySelector('#toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'일시정지'};
function draw(now){if(previous&&!paused)elapsed+=now-previous;previous=now;for(const {row,count,ctx} of displays){const n=Math.floor(elapsed/160);const col=count===3?[0,1,2,1][n%4]:n%count;ctx.clearRect(0,0,512,512);ctx.save();if(document.querySelector('#mirror').checked){ctx.translate(512,0);ctx.scale(-1,1)}ctx.drawImage(atlas,col*512,row*512,512,512,0,0,512,512);ctx.restore()}requestAnimationFrame(draw)}
atlas.onload=()=>requestAnimationFrame(draw);atlas.src='sprite-sheet-alpha.png';
</script></html>
