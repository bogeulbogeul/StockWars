<!doctype html><html lang="ko"><meta charset="utf-8"><title>강아지 기준 모션 비교</title>
<style>body{margin:24px;background:#ece6db;color:#332d25;font:16px system-ui}p{line-height:1.6}header{position:sticky;top:0;padding:12px;background:#ece6dbef;z-index:1}button,select{font:inherit;padding:8px;margin:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(550px,1fr));gap:18px}article{background:#fffaf0;padding:18px;border-radius:12px}h2{margin:0 0 10px}.poses{display:flex;gap:8px}.poses>div{width:33.33%;text-align:center}canvas{width:100%;display:block;background:repeating-conic-gradient(#e6e1d7 0% 25%,#f2eee5 0% 50%) 50%/20px 20px}small{color:#736859}</style>
<h1>강아지 기준 · 7종 모션 보정</h1><p>강아지 → 이전 모션 → 보정 모션을 같은 박자로 비교합니다.<br>걷기 3그림 · A → 중립 → B → 중립 · 160ms. 중립·정지·앉기·초상화는 기존 유지.<br><small>완성 프레임 비교용입니다. 게임 내 발 미끄러짐·화물 접촉 검수는 별도입니다.</small></p>
<header><select id="state"><option value="right_walk">사선 걷기</option><option value="down_walk">정면 걷기</option><option value="up_walk">뒤 걷기</option><option value="right_carry">운반</option></select><button id="play">멈추기</button><button id="step">한 프레임</button><label><input id="small" type="checkbox">90px 크기</label></header><main></main>
<script>const items=__ITEMS__,dog=__DOG__;let playing=true,tick=0,last=0;const state=document.querySelector('#state');for(const it of items){const a=document.createElement('article');a.innerHTML=`<h2>${it.label}</h2><div class="poses">${['강아지 기준','보정 전','보정 후'].map(t=>`<div><small>${t}</small><canvas width="320" height="400"></canvas></div>`).join('')}</div><small class="info"></small><p><a href="${it.id}/run/sprite-sheet-alpha.png">투명 시트</a> · <a href="${it.id}/run/qa/right_walk.gif">사선 GIF</a></p>`;document.querySelector('main').append(a);it.ctx=[...a.querySelectorAll('canvas')].map(c=>c.getContext('2d'));it.images=[dog.image,it.before,it.after].map(src=>{const im=new Image();im.src=src;return im});it.info=a.querySelector('.info')}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'멈추기':'재생'};document.querySelector('#step').onclick=()=>{playing=false;tick++;document.querySelector('#play').textContent='재생'};state.onchange=()=>{tick=0};function draw(t){if(playing&&t-last>=160){tick++;last=t}const s=state.value,order=s.endsWith('walk')?[0,1,2,1]:[0,1,2,3],idx=order[tick%4];for(const it of items){for(let k=0;k<3;k++){const m=k===0?dog.manifest:it.manifest,r=m.frame_layout.rows[s][idx],c=it.ctx[k];c.clearRect(0,0,320,400);c.save();c.translate(160,378);const scale=document.querySelector('#small').checked?.28:.88;c.scale(scale,scale);if(it.images[k].complete&&it.images[k].naturalWidth)c.drawImage(it.images[k],r.x,r.y,r.w,r.h,-160,-372,320,400);c.restore()}it.info.textContent=`프레임 ${idx+1} · 160ms`}requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
