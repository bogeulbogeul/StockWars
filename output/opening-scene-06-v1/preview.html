<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>처음 떠나는 길 · 마지막 장면</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c2b;color:#efe4ce;font-family:'Malgun Gothic',sans-serif;display:grid;min-height:100vh;place-content:center;gap:18px}
main{position:relative;width:min(100vw,1280px);aspect-ratio:16/9;overflow:hidden;background:#efe0c6;isolation:isolate}
.picture{position:absolute;inset:0;animation:approach 15s ease-out both}
.picture img{position:absolute;width:100%;height:100%;object-fit:cover}
.boarding{animation:board 15s both}
.sunlight{position:absolute;inset:0;background:radial-gradient(ellipse at 85% 15%,#fff3c544,transparent 65%);animation:light 15s both;pointer-events:none}
.caption{position:absolute;left:5%;right:5%;bottom:3%;margin:0;padding:clamp(8px,1.2vw,16px) 12px;border-radius:12px;background:#fff6e6;color:#302419;text-align:center;font-size:clamp(17px,2.5vw,32px);font-weight:700;line-height:1.65;word-break:keep-all;box-shadow:0 2px 12px #38251418}
.first{animation:first 15s both}.second{animation:second 15s both}.last{animation:last 15s both}
.veil{position:absolute;inset:0;background:#f5ead7;pointer-events:none;animation:veil 15s both}
footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;font-size:13px;color:#bdb5a6;padding:0 10px 12px}
button,a{border:1px solid #b4a58c;border-radius:30px;padding:10px 20px;background:transparent;color:#efe4ce;cursor:pointer;font:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #ffe0a0;outline-offset:4px}
@keyframes approach{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes board{0%,26%{opacity:1}34%,100%{opacity:0}}
@keyframes light{0%,30%{opacity:0}85%,100%{opacity:1}}
@keyframes first{0%{opacity:0}7%,24%{opacity:1}29%,100%{opacity:0}}
@keyframes second{0%,33%{opacity:0}39%,54%{opacity:1}59%,100%{opacity:0}}
@keyframes last{0%,60%{opacity:0}66%,100%{opacity:1}}
@keyframes veil{0%{opacity:1}7%,91%{opacity:0}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.picture,.sunlight,.last{animation:none}.boarding,.first,.second,.veil{display:none}}
</style>
<main aria-label="소망이가 아침 버스에 올라 편지와 씨앗을 품고 창밖을 바라봅니다. 마을로 향하는 여정 위에서 오프닝이 끝납니다.">
 <div class="picture" aria-hidden="true"><img src="journey-crayon.png" alt=""><img class="boarding" src="boarding-crayon.png" alt=""><div class="sunlight"></div></div>
 <p class="caption first">다음 날 아침,<br>요정은 마을로 가는 버스에 올랐어요.</p>
 <p class="caption second">아직 답을 찾지는 못했어요.</p>
 <p class="caption last">그래도 이제,<br>가 보고 싶은 곳은 생겼답니다.</p>
 <div class="veil"></div>
</main>
<footer><a href="../opening-scene-05-v1/preview.html">이전 장면</a><span>마지막 장면 · 15초 · 무음 시안</span><button type="button" onclick="location.reload()">다시 재생</button><a href="../opening-scene-01-v1/preview.html">첫 장면 보기</a></footer>
</html>
