<!doctype html><html lang="ko"><meta charset="utf-8"><title>시고르자브종 통합 시트</title><style>body{margin:24px;background:#eee9df;color:#34271d;font-family:system-ui}h1{font-size:24px}nav{display:flex;gap:12px;align-items:center}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}figure{margin:0;background:#fff9;padding:12px;border-radius:12px;text-align:center}canvas{width:180px;height:180px}figcaption{font-size:14px}button,select{padding:6px}</style><h1>시고르자브종 · 통합 스프라이트 시트</h1><p>10상태 · 걷기 3그림 / 운반 4그림 · 160ms · 정지·앉기·얼굴은 유지 자세 · 게임 미적용</p><nav><button id="play">일시정지</button><label>속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><a href="run/sprite-sheet-alpha.png">통합 PNG</a><a href="run/manifest.json">manifest</a></nav><main id="states"></main><script>const manifest={"characterId": "sigeureujabeujong", "engine": "component-row", "game_input": "sprite-sheet-alpha.png", "degraded_static_fallback": false, "curation_applied": true, "frame_variant": "pixel", "sprite_sheet_alpha": "sprite-sheet-alpha.png", "sprite_sheet_alpha_report": "sprite-sheet-alpha.report.json", "base_image": null, "cell": {"shape": "square", "width": 512, "height": 512, "size": 512, "safe_margin": 0}, "chroma_key": {"name": "magenta", "hex": "#FF00FF", "rgb": [255, 0, 255]}, "animation": {"cellWidth": 512, "cellHeight": 512, "columns": 4, "rows": {"down_idle": {"row": 0, "frames": 1, "fps": 6, "durations_ms": [160], "loop": false, "frame_variant": "pixel"}, "down_walk": {"row": 1, "frames": 4, "fps": 6, "durations_ms": [160, 160, 160, 160], "loop": true, "frame_variant": "pixel"}, "right_idle": {"row": 2, "frames": 1, "fps": 6, "durations_ms": [160], "loop": false, "frame_variant": "pixel"}, "right_walk": {"row": 3, "frames": 4, "fps": 6, "durations_ms": [160, 160, 160, 160], "loop": true, "frame_variant": "pixel"}, "up_idle": {"row": 4, "frames": 1, "fps": 6, "durations_ms": [160], "loop": false, "frame_variant": "pixel"}, "up_walk": {"row": 5, "frames": 4, "fps": 6, "durations_ms": [160, 160, 160, 160], "loop": true, "frame_variant": "pixel"}, "right_carry": {"row": 6, "frames": 4, "fps": 6, "durations_ms": [160, 160, 160, 160], "loop": true, "frame_variant": "pixel"}, "down_sit": {"row": 7, "frames": 1, "fps": 6, "durations_ms": [160], "loop": false, "frame_variant": "pixel"}, "right_sit": {"row": 8, "frames": 1, "fps": 6, "durations_ms": [160], "loop": false, "frame_variant": "pixel"}, "face_portrait": {"row": 9, "frames": 1, "fps": 6, "durations_ms": [160], "loop": false, "frame_variant": "pixel"}}}, "frame_layout": {"sheetWidth": 2048, "sheetHeight": 5120, "cellWidth": 512, "cellHeight": 512, "rows": {"down_idle": [{"x": 0, "y": 0, "w": 512, "h": 512}], "down_walk": [{"x": 0, "y": 512, "w": 512, "h": 512}, {"x": 512, "y": 512, "w": 512, "h": 512}, {"x": 1024, "y": 512, "w": 512, "h": 512}, {"x": 512, "y": 512, "w": 512, "h": 512}], "right_idle": [{"x": 0, "y": 1024, "w": 512, "h": 512}], "right_walk": [{"x": 0, "y": 1536, "w": 512, "h": 512}, {"x": 512, "y": 1536, "w": 512, "h": 512}, {"x": 1024, "y": 1536, "w": 512, "h": 512}, {"x": 512, "y": 1536, "w": 512, "h": 512}], "up_idle": [{"x": 0, "y": 2048, "w": 512, "h": 512}], "up_walk": [{"x": 0, "y": 2560, "w": 512, "h": 512}, {"x": 512, "y": 2560, "w": 512, "h": 512}, {"x": 1024, "y": 2560, "w": 512, "h": 512}, {"x": 512, "y": 2560, "w": 512, "h": 512}], "right_carry": [{"x": 0, "y": 3072, "w": 512, "h": 512}, {"x": 512, "y": 3072, "w": 512, "h": 512}, {"x": 1024, "y": 3072, "w": 512, "h": 512}, {"x": 1536, "y": 3072, "w": 512, "h": 512}], "down_sit": [{"x": 0, "y": 3584, "w": 512, "h": 512}], "right_sit": [{"x": 0, "y": 4096, "w": 512, "h": 512}], "face_portrait": [{"x": 0, "y": 4608, "w": 512, "h": 512}]}}};
const labels={"down_idle": "정면 정지", "down_walk": "정면 걷기", "right_idle": "오른쪽 정측면 정지", "right_walk": "오른쪽 정측면 걷기", "up_idle": "뒤 정지 · 귀 수정", "up_walk": "뒤 걷기 · 귀 수정", "right_carry": "운반 · 다리 교대 수정", "down_sit": "정면 앉기 · 짧은 다리", "right_sit": "아이소메트릭 앉기 · 짧은 다리", "face_portrait": "얼굴 초상화"};
const image=new Image();image.src='run/sprite-sheet-alpha.png';
const cards=Object.entries(manifest.frame_layout.rows).map(([state,rects])=>{const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=canvas.height=512;caption.textContent=labels[state];figure.append(canvas,caption);document.querySelector('#states').append(figure);return {state,rects,ctx:canvas.getContext('2d')};});
let playing=true,time=0,last=0;
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생';};
function paint(now){if(last&&playing)time+=(now-last)*Number(document.querySelector('#speed').value);last=now;if(image.complete&&image.naturalWidth)for(const {state,rects,ctx} of cards){const spec=manifest.animation.rows[state];const index=spec.loop?Math.floor(time/160)%rects.length:0;const r=rects[index];ctx.clearRect(0,0,512,512);ctx.drawImage(image,r.x,r.y,r.w,r.h,0,0,512,512);}requestAnimationFrame(paint);}requestAnimationFrame(paint);
</script></html>
