<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockWars · 데모 종료</title>
    <link rel="stylesheet" href="css/modules/demo-end.css">
</head>
<body class="demo-end-page">
    <main class="demo-end-card">
        <p class="demo-end-eyebrow">STOCKWARS DEMO</p>
        <h1>데모 버전이 끝났습니다</h1>
        <p>포포리 마을에서 함께한 7일, 즐거우셨나요?<br>소망이와 함께해 주셔서 감사합니다.</p>
        <p class="demo-end-status" data-status role="status" aria-live="polite">플레이 기록을 정리하고 있어요…</p>
        <div class="demo-end-actions">
            <button type="button" data-quit>종료하기</button>
            <button type="button" data-restart disabled>새로 시작하기</button>
        </div>
        <button type="button" data-retry hidden>기록 삭제 다시 시도</button>
    </main>
    <script type="module" src="js/app/DemoEndPage.js"></script>
</body>
</html>
